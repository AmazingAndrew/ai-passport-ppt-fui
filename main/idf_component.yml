## Component manifest for the PPT controller FUI application.
##
## The BLE HID driver (main/ble_hid.c) depends on the official
## `espressif/esp_hid` Managed Component, which is not part of the IDF
## itself but is resolved by the component manager using the
## dependencies.lock pinned at the repository root.
##
## The `kode_mono` dependency slot is intentionally empty: the Kode
## Mono fonts are bundled under main/fonts/kode_mono/ and are added to
## SRCS directly by main/CMakeLists.txt. No external font dependency
## is required.
dependencies:
  espressif/esp_hid: "*"
  idf: ">=5.5.3"